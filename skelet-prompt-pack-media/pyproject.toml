[project]
name = "skelet-prompt-pack-media"
version = "0.1.0"
description = "Generative-media prompt pack for skelet (video, 3D objects, sprite sheets)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "skelet",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
